[package]
name = "acropalypse_gif"
version = "0.2.0"
edition = "2021"
authors = ["Original project contributors"]
description = "GIF recovery extension for Acropalypse Multi-Tool"
license = "MIT OR Apache-2.0"

[lib]
name = "acropalypse_gif"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
anyhow = "1.0"
bitstream-io = "1.6"
byteorder = "1.5"
gif = "0.12"
thiserror = "1"
weezl = "0.1"
